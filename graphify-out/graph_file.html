const legendEl = document.getElementById('legend');
const legendFilter = document.getElementById('legend-filter');
let allNodes = RAW_NODES.slice().sort((a, b) => a.label.localeCompare(b.label));

function renderLegend(filter) {
  legendEl.innerHTML = '';
  const q = (filter || '').toLowerCase().trim();
  const items = q ? allNodes.filter(n => n.label.toLowerCase().includes(q)) : allNodes;
  items.forEach(n => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.dataset.nid = n.id;
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.className = 'legend-cb'; cb.checked = !nodesDS.get(n.id).hidden;
    cb.onchange = function() {
      nodesDS.update({ id: n.id, hidden: !this.checked });
      item.classList.toggle('dimmed', !this.checked);
      updateSelectAll();
    };
    item.appendChild(cb);
    const dot = document.createElement('div');
    dot.className = 'legend-dot'; dot.style.background = n.color.background;
    item.appendChild(dot);
    const span = document.createElement('span');
    span.className = 'legend-label'; span.textContent = n.label;
    item.appendChild(span);
    const cnt = document.createElement('span');
    cnt.className = 'legend-count'; cnt.textContent = n.community;
    item.appendChild(cnt);
    item.onclick = function(e) { if (e.target.tagName !== 'INPUT') { focusNode(n.id); } };
    legendEl.appendChild(item);
  });
}
legendFilter.addEventListener('input', function() { renderLegend(this.value); });

function updateSelectAll() {
  const cbs = document.querySelectorAll('.legend-cb');
  const checked = document.querySelectorAll('.legend-cb:checked');
  const all = document.getElementById('select-all-cb');
  if (checked.length === 0) all.checked = false;
  else if (checked.length === cbs.length) all.checked = true;
  else all.indeterminate = true;
  updateVisibleCount();
}
function toggleAll(el) {
  allNodes.forEach(n => {
    nodesDS.update({ id: n.id, hidden: !el.checked });
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = el.checked;
    cb.closest('.legend-item').classList.toggle('dimmed', !el.checked);
  });
  updateVisibleCount();
}
function updateVisibleCount() {
  const visible = nodesDS.get({ filter: n => !n.hidden }).length;
  document.getElementById('visible-count').textContent = '(' + visible + ' visible)';
}
const container = document.getElementById('graph');
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title, hidden: false,
  community: n.community, file_path: n.file_path
})));
const edgesDS = new vis.DataSet(RAW_EDGES.map(e => ({
  id: e.id, from: e.from, to: e.to, label: e.label,
  title: e.title, width: e.width, color: e.color,
  smooth: e.smooth, font: { size: 9, color: '#888', strokeWidth: 0 }
})));
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: { solver: 'forceAtlas2Based', forceAtlas2Based: { gravitationalConstant: -40, centralGravity: 0.005, springLength: 200, springConstant: 0.02, damping: 0.4 }, stabilization: { iterations: 200 } },
  nodes: { shape: 'dot', borderWidth: 1.5, scaling: { min: 8, max: 40 } },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
  interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true },
  manipulation: { enabled: false }
});
renderLegend('');
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  document.getElementById('info-content').innerHTML =
    '<div class="field"><b>' + esc(n.label) + '</b></div>' +
    '<div class="field">Community: ' + n.community + '</div>' +
    '<div class="field" style="font-size:11px;color:#888;word-break:break-all">' + esc(n.file_path || '') + '</div>';
  const nbIds = network.getConnectedNodes(nodeId);
  const nbList = document.getElementById('neighbors-list');
  if (!nbIds || nbIds.length === 0) { nbList.innerHTML = '<span class="empty">No connections</span>'; return; }
  nbList.innerHTML = nbIds.map(nid => {
    const nb = nodesDS.get(nid);
    if (!nb) return '';
    const c = typeof nb.color === 'object' ? (nb.color.background || '#333') : '#333';
    return '<span class="neighbor-link" style="border-left:3px solid ' + esc(c) + '" onclick="focusNode(' + JSON.stringify(nid) + ')">' + esc(nb.label) + '</span>';
  }).join('');
}
function focusNode(id) {
  network.selectNodes([id]);
  network.focus(id, { scale: 2, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  showInfo(id);
}
network.on('click', function(params) {
  if (params.nodes.length > 0) showInfo(params.nodes[0]);
});
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (!q) { searchResults.style.display = 'none'; searchResults.innerHTML = ''; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q) || (n.file_path && n.file_path.toLowerCase().includes(q))).slice(0, 20);
  if (matches.length === 0) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  searchResults.innerHTML = matches.map(n => '<div class="search-item" onclick="focusNode(\'' + n.id + '\'); searchInput.value=\'' + esc(n.label) + '\'; searchResults.style.display=\'none\'">' + esc(n.label) + '</div>').join('');
});
updateVisibleCount();
</script>
