auth:
  enabled: false
  jwt_secret: TODO_CHANGE_THIS_SECRET
  token_expiry_hours: 24
cameras:
  rgb:
    enabled: true
    fps: 56
    modes:
    - fps: 120
      label: "Tr\xE8s fluide, faible latence"
      resolution: 1536x864
    - fps: 56
      label: "\xC9quilibre qualit\xE9 + fluidit\xE9"
      resolution: 2304x1296
    - fps: 50
      label: Live Full HD
      resolution: 1920x1080
    - fps: 14
      label: "Qualit\xE9 max (photo / inspection)"
      resolution: 4608x2592
    quality: 80
    resolution: 2304x1296
  thermal:
    enabled: false
    fps: 30
    resolution: 640x512
control:
  pid_gains:
    altitude:
      kd: 0.01
      ki: 0.05
      kp: 2.5
    pitch:
      kd: 0.003
      ki: 0.02
      kp: 3.14
    roll:
      kd: 0.003
      ki: 0.02
      kp: 3.0
    yaw:
      kd: 0.001
      ki: 0.01
      kp: 2.0
detection:
  allow_rfdetr_on_pi: false
  backend: auto
  classes:
  - person
  confidence: 0.45
  enabled: true
  fallback_backend: yolo
  imgsz: 640
  interval_ms: 2000
  model: yolov8n.pt
  preferred_backend: yolo
  weights: backend/src/ia detection/rf-detr-develop/rf-detr-nano.pth
drone:
  max_altitude_m: 100
  max_speed_mps: 15
  telemetry_rate: 10
  uart:
    baudrate: 115200
    port: /dev/ttyUSB0
    timeout: 1.0
logging:
  file: logs/drone_system.log
  level: INFO
  max_size_mb: 50
server:
  host: 0.0.0.0
  port: 8000
  reload: false
  workers: 1
websocket:
  max_clients: 10
  telemetry_interval_ms: 100
