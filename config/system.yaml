auth:
  enabled: false
  jwt_secret: TODO_CHANGE_THIS_SECRET
  token_expiry_hours: 24
cameras:
  rgb:
    enabled: true
    fps: 30
    quality: 80
    # Mode par défaut : bon équilibre qualité / fluidité (voir modes ci-dessous)
    resolution: 2304x1296
    # Modes natifs caméra Pi — FPS max par résolution (rpicam-vid)
    modes:
      - resolution: 1536x864
        max_fps: 120
        label: Très fluide, faible latence
        fps_options: [15, 30, 60, 90, 120]
      - resolution: 2304x1296
        max_fps: 56
        label: Équilibre qualité + fluidité
        fps_options: [15, 24, 30, 40, 50, 56]
      - resolution: 1920x1080
        max_fps: 50
        label: Live Full HD
        fps_options: [15, 24, 30, 40, 50]
      - resolution: 4608x2592
        max_fps: 14
        label: Qualité max (photo / inspection)
        fps_options: [5, 10, 14]
  thermal:
    enabled: false
    fps: 30
    resolution: 640x512
detection:
  enabled: true
  threshold: 0.45
  inference_size: 416
  interval_ms: 3500
  weights: backend/src/ia detection/rf-detr-develop/rf-detr-nano.pth
  classes:
    - person
control:
  pid_gains:
    altitude:
      kd: 0.0
      ki: 0.0
      kp: 1.0
    pitch:
      kd: 0.003
      ki: 0.02
      kp: 3.14
    roll:
      kd: 0.0
      ki: 100.0
      kp: 1.0
    yaw:
      kd: 0.0
      ki: 0.0
      kp: 1.0
drone:
  max_altitude_m: 100
  max_speed_mps: 15
  telemetry_rate: 10
  uart:
    baudrate: 115200
    port: /dev/ttyUSB0
    timeout: 1.0
logging:
  file: logs/drone_system.log
  level: INFO
  max_size_mb: 50
server:
  host: 0.0.0.0
  port: 8000
  reload: false
  workers: 1
websocket:
  max_clients: 10
  telemetry_interval_ms: 100
