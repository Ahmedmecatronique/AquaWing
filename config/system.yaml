auth:
  enabled: false
  jwt_secret: TODO_CHANGE_THIS_SECRET
  token_expiry_hours: 24
cameras:
  rgb:
    enabled: true
    fps: 15
    quality: 80
    resolution: 1280x720
  thermal:
    enabled: false
    fps: 30
    resolution: 640x512
detection:
  # false = stable sur Raspberry Pi (évite crash mémoire / torch). Activer via POST /api/detect/rgb/start
  enabled: false
  threshold: 0.45
  inference_size: 560
  interval_ms: 2000
  weights: backend/src/ia detection/rf-detr-develop/rf-detr-nano.pth
  classes:
    - person
control:
  pid_gains:
    altitude:
      kd: 0.0
      ki: 0.0
      kp: 1.0
    pitch:
      kd: 0.003
      ki: 0.02
      kp: 3.14
    roll:
      kd: 0.0
      ki: 100.0
      kp: 1.0
    yaw:
      kd: 0.0
      ki: 0.0
      kp: 1.0
drone:
  max_altitude_m: 100
  max_speed_mps: 15
  telemetry_rate: 10
  uart:
    baudrate: 115200
    port: /dev/ttyUSB0
    timeout: 1.0
logging:
  file: logs/drone_system.log
  level: INFO
  max_size_mb: 50
server:
  host: 0.0.0.0
  port: 8000
  reload: false
  workers: 1
websocket:
  max_clients: 10
  telemetry_interval_ms: 100
